# Sonar Scanner Configuration for DataTeam Project

sonar.projectKey=datateam
sonar.projectName=DataTeam
sonar.projectVersion=1.1.0

# Path to source directories
sonar.sources=DataTeam

# Path to test directories (if applicable)
# sonar.tests=DataTeam.Tests

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Language
sonar.language=cs

# Exclusions
sonar.exclusions=\
  **/wwwroot/**,\
  **/bin/**,\
  **/obj/**,\
  **/*.Designer.cs,\
  **/Migrations/**,\
  **/Areas/Identity/**,\
  **/DOCS/**,\
  **/Backups/**

# Coverage exclusions
sonar.coverage.exclusions=\
  **/Program.cs,\
  **/Startup.cs,\
  **/Models/**,\
  **/ViewModels/**,\
  **/Data/Migrations/**

# .NET specific settings
sonar.cs.opencover.reportsPaths=coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/*.trx

# Code quality thresholds
sonar.qualitygate.wait=true

# Security hotspots
sonar.security.hotspots=enabled

# Rules customization
# Disable some rules that may not apply to web applications
sonar.issue.ignore.multicriteria=e1,e2,e3

# Rule 1: Disable "Cognitive Complexity" for controllers
sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*Controller.cs

# Rule 2: Allow TODO comments
sonar.issue.ignore.multicriteria.e2.ruleKey=csharpsquid:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**

# Rule 3: Allow magic numbers in view models
sonar.issue.ignore.multicriteria.e3.ruleKey=csharpsquid:S109
sonar.issue.ignore.multicriteria.e3.resourceKey=**/ViewModels/**
